server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser uses same-origin API URLs so its authentication cookie stays
    # scoped to getlifeos.co.  API requests must be handled before the SPA
    # fallback below; otherwise nginx returns index.html with a 200 response.
    location /api/ {
        proxy_pass https://lifeos-api-94214131383.us-east1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host lifeos-api-94214131383.us-east1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
